<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift — Vertex</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #c8ccd4; font: 14px monospace; }
    body { display: grid; place-items: center; }
    canvas { width: min(100vw, 133vh); aspect-ratio: 4 / 3; max-height: 100vh; }
    p { position: fixed; bottom: 8px; margin: 0; opacity: .6; }
  </style>
</head>
<body>
  <canvas id="c" width="1600" height="1200"></canvas>
  <p>←/→ turn · ↑ thrust · space fire · hold R to rewind time</p>
  <script type="module">
    import { bindKeys, attachAudio, Timeline } from '../../src/index.js';
    import { autoRenderer } from '../../src/webgl.js';
    import { createGame } from './drift.js';

    // The game runs inside a Timeline: inputs are logged and checkpoints kept, so time is scrubbable.
    const timeline = new Timeline(createGame, { seed: Date.now() >>> 0, every: 30 });
    bindKeys(timeline, { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'thrust', ' ': 'fire' });
    attachAudio(timeline.game);
    let rewinding = false;
    addEventListener('keydown', (e) => { if (e.key === 'r') rewinding = true; });
    addEventListener('keyup', (e) => { if (e.key === 'r') rewinding = false; });

    const renderer = await autoRenderer(document.getElementById('c'));  // WebGL2, else Canvas2D
    const dt = timeline.game.dt;
    let acc = 0, last = performance.now();
    requestAnimationFrame(function tick(now) {
      acc += Math.min(0.25, (now - last) / 1000); last = now;
      while (acc >= dt) {
        acc -= dt;
        if (rewinding) {
          timeline.game.muted = true;
          timeline.seek(timeline.frame - 2);          // 2x speed rewind
          timeline.game.muted = false;
        } else timeline.step(1);                       // acting after a rewind starts a new future
      }
      renderer.draw(timeline.game.world);
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
