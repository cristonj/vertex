<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vertex Player</title>
  <meta name="description" content="Play any Vertex cartridge: a whole vector game in one JSON file or link.">
  <style>
    :root { --bg: #0b0d12; --fg: #c8ccd4; --dim: #6b7280; --accent: #7df9ff; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, monospace; }
    body { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    header, footer { padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    header b { color: var(--accent); letter-spacing: .08em; }
    header a { color: inherit; text-decoration: none; }
    #title { color: #fff; }
    main { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 16px; }
    canvas { max-width: 100%; max-height: calc(100dvh - 96px); background: #000; image-rendering: auto; outline: none; }
    button { background: none; color: var(--fg); border: 1px solid #ffffff2e; border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--accent); color: #fff; }
    .sp { flex: 1; }
    .dim { color: var(--dim); }
    #overlay { position: absolute; inset: 0; display: none; place-items: center; background: #0008; font-size: 18px; color: #fff; letter-spacing: .1em; pointer-events: none; }
    body.paused #overlay { display: grid; }
    #drop { display: none; position: fixed; inset: 0; background: #000b; place-items: center; font-size: 20px; z-index: 30; }
    body.dragging #drop { display: grid; }
    @media (max-width: 560px) { .wide { display: none; } }
  </style>
</head>
<body>
  <header>
    <a href="./"><b>VERTEX</b></a><span id="title">loading…</span><span class="dim wide" id="size"></span>
    <span class="sp"></span>
    <button id="pause" title="Pause (P)">pause</button>
    <button id="restart" title="Restart (0)">restart</button>
    <button id="mute" title="Mute (M)">sound on</button>
    <button id="share" class="wide" title="Copy a link that contains the whole game">link</button>
    <button id="dev" title="Inspector (`)">inspect</button>
    <button id="full" class="wide" title="Fullscreen">⛶</button>
    <button id="open" class="wide">open</button>
  </header>
  <main><canvas id="c" width="800" height="600" tabindex="0"></canvas><div id="overlay">PAUSED</div></main>
  <footer class="dim"><span id="keys"></span><span class="wide">· hold R to rewind · ` inspector · drop/paste a cartridge</span></footer>
  <div id="drop">drop a Vertex cartridge</div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <script type="module">
    // The universal player: any cartridge from a link (#c=...), a URL (?src=...), a file, or the clipboard.
    import { loadCartridge, encodeCartridge, decodeCartridge, bindKeys, bindPointer, bindGamepad, touchControls,
      isTouchDevice, attachAudio, Timeline } from './src/index.js';
    import { autoRenderer } from './src/webgl.js';
    import { mountInspector } from './src/devtools.js';

    const $ = (id) => document.getElementById(id);
    const canvas = $('c');
    let current = null;            // { doc, source, timeline, stop }
    let muted = false;
    try { muted = localStorage.getItem('vx-muted') === '1'; } catch {}
    $('mute').textContent = muted ? 'sound off' : 'sound on';

    function gamepadRename(actions) {
      const has = (a) => actions.includes(a);
      const primary = actions.find((a) => !['up', 'down', 'left', 'right', 'pointer'].includes(a));
      return { up: has('up') ? 'up' : has('thrust') ? 'thrust' : has('jump') ? 'jump' : 'up', jump: primary ?? 'jump', fire: has('fire') ? 'fire' : primary ?? 'fire', action: primary ?? 'action' };
    }

    let inspector = null, renderer = null;

    async function start(doc, source = JSON.stringify(doc, null, 2), seed = Date.now() >>> 0) {
      current?.stop();
      const W = doc.width ?? 800, H = doc.height ?? 600, dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.aspectRatio = `${W} / ${H}`;
      canvas.style.width = `min(100%, ${W * 2}px, calc((100dvh - 96px) * ${W / H}))`;
      $('title').textContent = doc.title ?? 'Untitled';
      $('size').textContent = `${(source.length / 1024).toFixed(1)} KB`;
      const actions = [...new Set(Object.values(doc.keys ?? {}))];
      $('keys').textContent = Object.entries(doc.keys ?? {}).map(([k, a]) => `${k === ' ' ? 'space' : k.replace('Arrow', '')}: ${a}`).join(' · ');
      document.title = `${doc.title ?? 'Untitled'} — Vertex`;

      const timeline = new Timeline((o) => loadCartridge(doc, o), { seed, every: 30 });
      const gameKeys = new Set(Object.keys(doc.keys ?? {}).map((k) => k.toLowerCase()));
      const unbinds = [
        bindKeys(timeline, doc.keys ?? {}),
        bindPointer(timeline, canvas, () => timeline.game.world),
        bindGamepad(timeline, { rename: gamepadRename(actions) }),
        attachAudio(timeline.game),
      ];
      if (isTouchDevice() && actions.length) unbinds.push(touchControls(timeline, actions));
      renderer ??= await autoRenderer(canvas);
      if (inspector) inspector.setTimeline(timeline);
      else inspector = mountInspector({ timeline, canvas, getSource: () => current.source, reload: (src) => start(JSON.parse(src), src, timeline.opts.seed) });

      let rewinding = false, raf = 0, acc = 0, last = performance.now();
      const key = (e, down) => {
        if (e.target.closest?.('textarea, input')) return;
        const k = e.key.toLowerCase();
        if (k === 'r' && !gameKeys.has('r')) rewinding = down;
        if (!down) return;
        if (k === 'p' && !gameKeys.has('p')) togglePause();
        else if (k === 'm' && !gameKeys.has('m')) toggleMute();
        else if (k === '`') inspector.toggle();
        else if (k === '0' && !gameKeys.has('0')) restart();
      };
      const kd = (e) => key(e, true), ku = (e) => key(e, false);
      addEventListener('keydown', kd); addEventListener('keyup', ku);
      const dt = timeline.game.dt;
      const tick = (now) => {
        acc += Math.min(0.25, (now - last) / 1000); last = now;
        if (inspector.paused) acc = 0;
        while (acc >= dt) {
          acc -= dt;
          timeline.game.muted = muted;
          if (rewinding) { timeline.game.muted = true; timeline.seek(timeline.frame - 2); }
          else timeline.step(1);
        }
        renderer.draw(timeline.game.world);
        inspector.update(renderer);
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      current = { doc, source, timeline, stop: () => { cancelAnimationFrame(raf); unbinds.forEach((u) => u()); removeEventListener('keydown', kd); removeEventListener('keyup', ku); } };
      canvas.focus();
    }

    function togglePause() { inspector.setPaused(!inspector.paused); document.body.classList.toggle('paused', inspector.paused); $('pause').textContent = inspector.paused ? 'play' : 'pause'; }
    function toggleMute() { muted = !muted; $('mute').textContent = muted ? 'sound off' : 'sound on'; try { localStorage.setItem('vx-muted', muted ? '1' : '0'); } catch {} }
    function restart() { if (current) start(current.doc, current.source); }

    $('pause').onclick = togglePause;
    $('mute').onclick = toggleMute;
    $('restart').onclick = restart;
    $('dev').onclick = () => inspector?.toggle();
    $('full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.querySelector('main').requestFullscreen?.());
    $('share').onclick = async () => {
      const url = `${location.origin}${location.pathname}#c=${await encodeCartridge(current.doc)}`;
      try { await navigator.clipboard.writeText(url); $('share').textContent = `copied (${url.length} chars)`; }
      catch { prompt('Link to this game:', url); }
      setTimeout(() => ($('share').textContent = 'link'), 1800);
    };

    const fail = (e) => { $('title').textContent = `error: ${e.message}`; console.error(e); };
    const fromText = (text) => { try { start(JSON.parse(text), text).catch(fail); } catch (e) { fail(e); } };
    $('open').onclick = () => $('file').click();
    $('file').onchange = async () => { const f = $('file').files[0]; if (f) fromText(await f.text()); };
    addEventListener('paste', (e) => { if (e.target.closest?.('textarea, input')) return; const t = e.clipboardData.getData('text'); if (t.trim().startsWith('{')) fromText(t); });
    addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
    addEventListener('dragleave', () => document.body.classList.remove('dragging'));
    addEventListener('drop', async (e) => { e.preventDefault(); document.body.classList.remove('dragging'); const f = e.dataTransfer.files[0]; if (f) fromText(await f.text()); });

    const hash = new URLSearchParams(location.hash.slice(1));
    const src = new URLSearchParams(location.search).get('src');
    if (hash.get('c')) decodeCartridge(hash.get('c')).then((d) => start(d)).catch(fail);
    else fetch(src ?? 'examples/starfall/starfall.json').then((r) => r.text()).then(fromText).catch(fail);
  </script>
</body>
</html>
